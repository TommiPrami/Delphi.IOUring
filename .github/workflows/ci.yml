# Free Pascal tests on Linux x64, Linux ARM64 and Windows (Docs/Design.md
# §12.5). Delphi is tested locally (its compiler needs a licensed IDE).
#
# Every push to main, every pull request, and by hand (Actions > CI > Run
# workflow): the tests (debug build and -O3), the layout check of the Linux
# API translation, the benchmarks and the Lazarus package built, the demos
# built and run once. The
# benchmarks are not run here: the runners are slow cloud machines, and the
# runs take long (Docs/Design.md 12.6; the numbers of the one run are in
# Docs/Benchmarks.md).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push stops the run of the older one
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: ubuntu-24.04
          - arch: ARM64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - name: Install Free Pascal
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y fpc

      - name: The system
        shell: bash
        run: |
          uname -a
          grep PRETTY_NAME /etc/os-release
          echo "kernel.io_uring_disabled: $(cat /proc/sys/kernel/io_uring_disabled 2>/dev/null || echo 'not there')"
          echo "Locked memory limit (ulimit -l): $(ulimit -l)"
          echo "Free Pascal: $(fpc -iV)"

      # Every failed test also becomes an annotation of the run
      - name: Tests (debug build)
        run: ./.github/scripts/Invoke-Tests.ps1

      - name: Tests (-O3)
        if: success() || failure()
        run: ./.github/scripts/Invoke-Tests.ps1 -Optimize

      # The C header's layout on this CPU must give the same checks as the
      # committed file. Only the checks count: the first lines name the
      # header version and the CPU (git keeps the file with LF, the generator
      # writes CRLF). A difference becomes annotations of the run.
      - name: Layout of the Linux API translation
        if: success() || failure()
        shell: bash
        run: |
          cd Source/UnitTests/Linux
          cp PIRInclude.Linux.API.Layout.inc "$RUNNER_TEMP/committed.inc"
          if ! bash Generate-LinuxApiLayout.sh > "$RUNNER_TEMP/generate.log" 2>&1; then
            cat "$RUNNER_TEMP/generate.log"
            tail -n 10 "$RUNNER_TEMP/generate.log" | while IFS= read -r line; do echo "::error title=Layout generator::${line//%/%25}"; done
            exit 1
          fi
          cat "$RUNNER_TEMP/generate.log"
          head -n 2 PIRInclude.Linux.API.Layout.inc
          if ! diff <(grep -F 'ACheck(' "$RUNNER_TEMP/committed.inc" | tr -d '\r') \
                    <(grep -F 'ACheck(' PIRInclude.Linux.API.Layout.inc | tr -d '\r') > "$RUNNER_TEMP/layout.diff"; then
            cat "$RUNNER_TEMP/layout.diff"
            head -n 10 "$RUNNER_TEMP/layout.diff" | while IFS= read -r line; do echo "::error title=Layout differs on this CPU::${line//%/%25}"; done
            exit 1
          fi
          echo "The same $(grep -cF 'ACheck(' PIRInclude.Linux.API.Layout.inc) checks as the committed file"

      # The Lazarus package's main unit, compiled with FPC (no Lazarus here)
      - name: Build the benchmarks and the Lazarus package
        if: success() || failure()
        run: |
          foreach ($project in 'Benchmarks', 'Structures', 'Blocks', 'Writes', 'Package') {
            ./Source/Build-FPC.ps1 -Project $project
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Each demo runs once without arguments and checks its own result
      - name: Build and run the demos
        if: success() || failure()
        run: ./Source/Build-FPC.ps1 -Project Demos -Run

  windows:
    name: Windows (Win32, Win64)
    runs-on: windows-2025
    defaults:
      run:
        shell: pwsh
    env:
      FPC_DIR: C:\FPC\3.2.2
    steps:
      - uses: actions/checkout@v7

      - name: Cache Free Pascal
        id: fpc-cache
        uses: actions/cache@v6
        with:
          path: C:\FPC
          key: fpc-3.2.2-win32-and-win64

      # One installer with both compilers: i386 native, x86_64 cross
      - name: Install Free Pascal 3.2.2
        if: steps.fpc-cache.outputs.cache-hit != 'true'
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'fpc-3.2.2.win32.and.win64.exe'
          Invoke-WebRequest -Uri 'https://downloads.freepascal.org/fpc/dist/3.2.2/i386-win32/fpc-3.2.2.win32.and.win64.exe' -OutFile $installer
          Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$env:FPC_DIR" -Wait
          Get-ChildItem -Path "$env:FPC_DIR\bin" -Recurse -Filter 'ppc*.exe' | ForEach-Object FullName

      - name: The system
        run: |
          Get-CimInstance Win32_OperatingSystem | Format-List Caption, Version, BuildNumber

      # Where IoRing version 4 is missing, the tests are only built: the test
      # program then reports "Not available: <reason>" first, and the step
      # passes with a warning. Every failed test becomes an annotation.
      - name: Tests (Win32 and Win64, debug build and -O3)
        run: |
          $failed = $false
          foreach ($platform in 'Win32', 'Win64') {
            foreach ($optimize in $false, $true) {
              Write-Host "=== $platform, optimize: $optimize"
              ./.github/scripts/Invoke-Tests.ps1 -Platform $platform -FpcDir $env:FPC_DIR -Optimize:$optimize -AllowNotAvailable
              if ($LASTEXITCODE -ne 0) { $failed = $true }
            }
          }
          if ($failed) { exit 1 }

      - name: Build the benchmarks and the Lazarus package
        if: success() || failure()
        run: |
          foreach ($platform in 'Win32', 'Win64') {
            foreach ($project in 'Benchmarks', 'Structures', 'Blocks', 'Writes', 'Package') {
              ./Source/Build-FPC.ps1 -Project $project -Platform $platform -FpcDir $env:FPC_DIR
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      # Each demo runs once without arguments and checks its own result
      - name: Build and run the demos (Win32, Win64)
        if: success() || failure()
        run: |
          foreach ($platform in 'Win32', 'Win64') {
            ./Source/Build-FPC.ps1 -Project Demos -Platform $platform -FpcDir $env:FPC_DIR -Run
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
